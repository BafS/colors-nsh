name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: nsh check
      - run: nsh test
      - name: Package web
        run: nsh package --target web
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: .nsh/out/Colors

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Package macOS
        run: nsh package --target macos
      - name: Zip app
        run: ditto -c -k --keepParent .nsh/out/Colors.app Colors-macos.zip
      - uses: actions/upload-artifact@v5
        with:
          name: Colors-macos
          path: Colors-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install nsh
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          Join-Path $env:LOCALAPPDATA 'nsh\bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Package Windows
        run: nsh package --target windows
      - name: Collect zip
        shell: pwsh
        run: |
          Get-ChildItem .nsh/out
          $zip = Get-ChildItem .nsh/out -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "no .zip in .nsh/out" }
          Copy-Item $zip.FullName Colors-windows.zip
      - uses: actions/upload-artifact@v5
        with:
          name: Colors-windows
          path: Colors-windows.zip

  release:
    needs: [test, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: Colors-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Colors-macos.zip
            Colors-windows.zip
          generate_release_notes: true

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
